# No `base` is set on purpose: with it omitted, Streamlit follows the viewer's
# system light/dark preference and picks the matching palette below. Both
# palettes are drawn from the same brand colours the Excel packs use — navy,
# brass and ivory — so the app and the workbook read as one product.

[theme]
font = "sans serif"

[theme.light]
primaryColor = "#1B2438"            # navy: buttons, the wordmark, focus states
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F1E8"  # ivory, as used for subtotal rows in the pack
textColor = "#23272E"                 # ink

[theme.dark]
# Inverted rather than merely darkened: navy becomes the surface and brass the
# accent, which is how the pack's masthead is already built.
primaryColor = "#C6A15B"            # brass
backgroundColor = "#131A29"         # deeper than the masthead so navy can sit on it
secondaryBackgroundColor = "#1B2438"  # navy
textColor = "#E8EAEE"

[server]
maxUploadSize = 50

# Streamlit's source watcher deletes the modules it tracks from `sys.modules` on
# every reload, and does it without a lock. When a rerun starts before the purge
# finishes, an import lands on a half-emptied `sys.modules` and dies with
# `KeyError: 'flux.coa'` - or, worse, somewhere deep in the import machinery that
# names neither the module nor the cause. Upstream: streamlit/streamlit#1430,
# #1644 and #6404.
#
# `flux` is a library the app imports, not app code: it is not edited between
# reruns, so nothing is lost by taking it out of the watcher's hands. The cost is
# local only - editing a file under src/ no longer triggers a hot reload, so
# restart the server after changing the engine.
folderWatchBlacklist = ["src"]
