<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Flux">
  <title>Flux</title>
  <!-- The variance, drawn: a plan bar, a shorter actual bar, and the rule marking
       where plan sat. The space between the rule and the bar is the gap the whole
       tool exists to explain.

       Both tones are legible on a white and on a navy ground, so one mark serves
       the light and the dark theme. Streamlit can report the active theme but
       documents it as unreliable on first load, so the mark does not depend on it. -->
  <rect x="7"  y="12" width="15" height="30" rx="2.5" fill="#8AA0CC"/>
  <rect x="26" y="24" width="15" height="18" rx="2.5" fill="#C6A15B"/>
  <rect x="26" y="12" width="15" height="4"  rx="2"   fill="#C6A15B"/>
</svg>
