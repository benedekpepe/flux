name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check src scripts tests app.py

      - name: Import smoke test
        run: |
          PYTHONPATH=src python -c "import flux; print('flux', flux.__version__)"
          PYTHONPATH=src python -c "from flux.reporting import build_demo_pack, build_client_pack"

      - name: Verification suite
        run: python tests/audit.py

      - name: Build every pack end to end
        run: |
          PYTHONPATH=src python -m flux.reporting.demo_pack
          PYTHONPATH=src python -m flux.reporting.client_pack
          PYTHONPATH=src python -m flux.reporting.pptx_pack

      - name: App smoke test
        run: |
          python - <<'PY'
          import warnings
          warnings.filterwarnings("ignore")
          from streamlit.testing.v1 import AppTest

          at = AppTest.from_file("app.py", default_timeout=300).run()
          assert not at.exception, at.exception
          labels = [m.label for m in at.metric]
          assert labels == ["Revenue", "EBIT", "Net income"], labels
          print("App rendered:", labels)
          PY

      - name: Upload the generated packs
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: flux-packs
          path: |
            output/*.xlsx
            output/*.pptx
          retention-days: 14
