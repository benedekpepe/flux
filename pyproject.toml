[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flux-reporting"
version = "0.5.0"
description = "Management reporting engine: general ledger to P&L variance pack"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Benedek Péter", email = "hello@bpstudio.hu" }]
keywords = ["fpa", "controlling", "variance analysis", "management reporting"]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.49"]
llm = ["anthropic>=0.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Correctness rules only: pyflakes plus the pycodestyle errors that matter.
# Style beyond that is left to judgement rather than enforced by a bot.
select = ["E4", "E7", "E9", "F", "W"]
ignore = [
    # Paired cell assignments (value; font; alignment) read better on one line
    # in the Excel writers than as three separate statements.
    "E702",
    # Short range-builder lambdas are local aliases, not reusable functions.
    "E731",
    # I, L and E are Excel column letters here, which is the clearest name.
    "E741",
]
